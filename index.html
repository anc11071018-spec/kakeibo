<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>家計簿 Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F7F5F0; color: #1A1A1A; font-family: -apple-system, sans-serif; }
  input { -webkit-appearance: none; border-radius: 8px; border: 1px solid #E8E4DC; padding: 12px; font-size: 16px; width: 100%; margin-top: 8px; }
  .btn { cursor: pointer; border: none; outline: none; }
  .btn:active { opacity: 0.5; }
  .list-item { padding: 15px 20px; border-bottom: 1px solid #F5F5F5; display: flex; justify-content: space-between; align-items: center; background: #FFF; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const CATEGORIES = [
  { id: "food", label: "食費", icon: "🍱" },
  { id: "transport", label: "交通費", icon: "🚃" },
  { id: "shopping", label: "買い物", icon: "🛍" },
  { id: "other", label: "その他", icon: "📌" },
];

function yen(n) { return "¥" + Number(n).toLocaleString("ja-JP"); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

function App() {
  const [expenses, setExpenses] = useState(() => {
    const s = localStorage.getItem("kk_exp_final");
    return s ? JSON.parse(s) : [];
  });
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ amount: "", category: "food", memo: "", date: todayStr() });
  const [editId, setEditId] = useState(null);

  useEffect(() => { localStorage.setItem("kk_exp_final", JSON.stringify(expenses)); }, [expenses]);

  const dailyMap = useMemo(() => {
    const map = {};
    expenses.forEach(e => { (map[e.date] = map[e.date] || []).push(e); });
    return map;
  }, [expenses]);

  const sortedDates = useMemo(() => Object.keys(dailyMap).sort((a,b) => b.localeCompare(a)), [dailyMap]);

  // iPhoneでカレンダーアプリを直接起動させるためのリンク生成
  const exportToCalendar = (date, total) => {
    const cleanDate = date.replace(/-/g, "");
    const ics = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "BEGIN:VEVENT",
      `DTSTART;VALUE=DATE:${cleanDate}`,
      `DTEND;VALUE=DATE:${cleanDate}`,
      `SUMMARY:支出合計: ${yen(total)}`,
      "DESCRIPTION:家計簿アプリより同期",
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\n");
    
    // データスキームを text/calendar に固定し、iPhoneにカレンダーデータだと認識させる
    const url = "data:text/calendar;charset=utf8," + encodeURIComponent(ics);
    window.location.assign(url);
  };

  const submitForm = (e) => {
    e.preventDefault();
    if (!form.amount) return;
    const newEntry = { id: editId || Date.now(), ...form, amount: Number(form.amount) };
    if (editId) {
      setExpenses(p => p.map(ex => ex.id === editId ? newEntry : ex));
    } else {
      setExpenses(p => [newEntry, ...p]);
    }
    setShowForm(false);
    setEditId(null);
  };

  return (
    <div style={{ maxWidth: 430, margin: "0 auto", paddingBottom: 100 }}>
      <header style={{ padding: "30px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <h1 style={{ fontSize: "22px" }}>家計簿ログ</h1>
        <button onClick={() => { setEditId(null); setForm({ amount: "", category: "food", memo: "", date: todayStr() }); setShowForm(true); }} className="btn" style={{ background: "#1A1A1A", color: "#FFF", width: 44, height: 44, borderRadius: "50%", fontSize: "24px" }}>+</button>
      </header>

      {sortedDates.map(date => {
        const total = dailyMap[date].reduce((s,e) => s + e.amount, 0);
        return (
          <div key={date} style={{ marginBottom: 12 }}>
            <div style={{ padding: "10px 20px", background: "#F0EDE6", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: "13px", fontWeight: "bold" }}>{date}</span>
              <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
                <span style={{ fontSize: "14px", fontWeight: "bold" }}>{yen(total)}</span>
                <button onClick={() => exportToCalendar(date, total)} className="btn" style={{ background: "#1A1A1A", color: "#FFF", padding: "6px 12px", borderRadius: "6px", fontSize: "11px" }}>カレンダーに追加</button>
              </div>
            </div>
            {dailyMap[date].map(ex => (
              <div key={ex.id} onClick={() => { setForm({ amount: String(ex.amount), category: ex.category, memo: ex.memo, date: ex.date }); setEditId(ex.id); setShowForm(true); }} className="list-item">
                <div style={{ display: "flex", gap: "15px", alignItems: "center" }}>
                  <span style={{ fontSize: "24px" }}>{CATEGORIES.find(c => c.id === ex.category)?.icon}</span>
                  <div>
                    <div style={{ fontSize: "15px" }}>{ex.memo || CATEGORIES.find(c => c.id === ex.category)?.label}</div>
                    <div style={{ fontSize: "11px", color: "#999" }}>修正</div>
                  </div>
                </div>
                <span style={{ fontSize: "16px", fontWeight: "500" }}>{yen(ex.amount)}</span>
              </div>
            ))}
          </div>
        );
      })}

      {showForm && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "flex-end", zIndex: 100 }}>
          <div style={{ background: "#FFF", width: "100%", padding: "30px", borderRadius: "20px 20px 0 0" }}>
            <form onSubmit={submitForm}>
              <h3 style={{ marginBottom: "20px" }}>{editId ? "記録を編集" : "新しく入力"}</h3>
              <input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
              <input type="number" placeholder="金額" value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} style={{marginTop: "15px"}} />
              <input type="text" placeholder="メモ" value={form.memo} onChange={e => setForm({...form, memo: e.target.value})} style={{marginTop: "15px"}} />
              <button type="submit" style={{ width: "100%", marginTop: "25px", padding: "16px", background: "#1A1A1A", color: "#FFF", borderRadius: "12px", fontSize: "16px", fontWeight: "bold" }} className="btn">保存する</button>
              <button type="button" onClick={() => setShowForm(false)} style={{ width: "100%", marginTop: "10px", color: "#999", background: "none" }} className="btn">キャンセル</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
