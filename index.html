<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿 Pro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #F7F5F0; color: #1A1A1A; font-family: 'Hiragino Mincho ProN', 'Yu Mincho', Georgia, serif; -webkit-tap-highlight-color: transparent; }
  input { -webkit-appearance: none; border-radius: 8px; }
  .btn { cursor: pointer; transition: opacity 0.2s; border: none; }
  .btn:active { opacity: 0.6; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect } = React;

const CATEGORIES = [
  { id: "food", label: "食費", icon: "🍱" },
  { id: "transport", label: "交通費", icon: "🚃" },
  { id: "shopping", label: "買い物", icon: "🛍" },
  { id: "other", label: "その他", icon: "📌" },
];

function yen(n) { return "¥" + Number(n).toLocaleString("ja-JP"); }
function todayStr() { return new Date().toISOString().slice(0, 10); }

const inputSt = {
  width: "100%", background: "#FFF", border: "1px solid #E8E4DC",
  padding: "12px", fontSize: "16px", outline: "none", marginTop: "8px"
};

function App() {
  const [expenses, setExpenses] = useState(() => {
    const s = localStorage.getItem("kk_exp_v2");
    return s ? JSON.parse(s) : [];
  });
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ amount: "", category: "food", memo: "", date: todayStr() });

  useEffect(() => { localStorage.setItem("kk_exp_v2", JSON.stringify(expenses)); }, [expenses]);

  const dailyMap = useMemo(() => {
    const map = {};
    expenses.forEach(e => { (map[e.date] = map[e.date] || []).push(e); });
    return map;
  }, [expenses]);

  const sortedDates = useMemo(() => Object.keys(dailyMap).sort((a,b) => b.localeCompare(a)), [dailyMap]);

  // カレンダー形式(.ics)で書き出す機能
  const exportToCalendar = (date, total) => {
    const cleanDate = date.replace(/-/g, "");
    const icsContent = [
      "BEGIN:VCALENDAR",
      "VERSION:2.0",
      "BEGIN:VEVENT",
      `DTSTART;VALUE=DATE:${cleanDate}`,
      `SUMMARY:支出合計: ${yen(total)}`,
      "DESCRIPTION:家計簿アプリからの出力",
      "END:VEVENT",
      "END:VCALENDAR"
    ].join("\r\n");
    
    const blob = new Blob([icsContent], { type: "text/calendar;charset=utf-8" });
    const link = document.createElement("a");
    link.href = window.URL.createObjectURL(blob);
    link.download = `kakeibo-${date}.ics`;
    link.click();
  };

  const submitForm = (e) => {
    e.preventDefault();
    if (!form.amount) return;
    setExpenses(p => [{ id: Date.now(), ...form, amount: Number(form.amount) }, ...p]);
    setShowForm(false);
  };

  return (
    <div style={{ maxWidth: 430, margin: "0 auto", paddingBottom: 100 }}>
      <header style={{ padding: "30px 20px", borderBottom: "1px solid #EEE" }}>
        <h1 style={{ fontSize: "24px", fontWeight: "normal" }}>支出ログ</h1>
      </header>

      {sortedDates.map(date => {
        const total = dailyMap[date].reduce((s,e) => s + e.amount, 0);
        return (
          <div key={date} style={{ marginBottom: 15 }}>
            <div style={{ padding: "10px 20px", background: "#F0F0F0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <span style={{ fontSize: "12px", color: "#666" }}>{date}</span>
              <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                <b style={{ fontSize: "14px" }}>{yen(total)}</b>
                <button onClick={() => exportToCalendar(date, total)} className="btn" style={{ fontSize: "10px", background: "#1A1A1A", color: "#FFF", padding: "4px 8px", borderRadius: "4px" }}>📅 連携</button>
              </div>
            </div>
            {dailyMap[date].map(ex => (
              <div key={ex.id} style={{ padding: "12px 20px", borderBottom: "1px solid #F5F5F5", display: "flex", justifyContent: "space-between" }}>
                <span>{CATEGORIES.find(c => c.id === ex.category)?.icon} {ex.memo || "無題"}</span>
                <span>{yen(ex.amount)}</span>
              </div>
            ))}
          </div>
        );
      })}

      <button onClick={() => setShowForm(true)} style={{ position: "fixed", bottom: 30, right: 20, width: 60, height: 60, borderRadius: "50%", background: "#1A1A1A", color: "#FFF", fontSize: "30px", boxShadow: "0 4px 10px rgba(0,0,0,0.3)" }} className="btn">+</button>

      {showForm && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.5)", display: "flex", alignItems: "flex-end", zIndex: 100 }}>
          <div style={{ background: "#FFF", width: "100%", padding: "25px", borderRadius: "20px 20px 0 0" }}>
            <form onSubmit={submitForm}>
              <label style={{ fontSize: "12px", color: "#999" }}>日付選択</label>
              <input type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} style={inputSt} />
              
              <div style={{ marginTop: "15px" }}>
                <label style={{ fontSize: "12px", color: "#999" }}>金額</label>
                <input type="number" placeholder="0" value={form.amount} onChange={e => setForm({...form, amount: e.target.value})} style={inputSt} />
              </div>

              <div style={{ marginTop: "15px" }}>
                <label style={{ fontSize: "12px", color: "#999" }}>メモ</label>
                <input type="text" placeholder="品名など" value={form.memo} onChange={e => setForm({...form, memo: e.target.value})} style={inputSt} />
              </div>

              <button type="submit" style={{ width: "100%", marginTop: "20px", padding: "15px", background: "#1A1A1A", color: "#FFF", borderRadius: "10px", fontSize: "16px" }} className="btn">追加する</button>
              <button type="button" onClick={() => setShowForm(false)} style={{ width: "100%", marginTop: "10px", padding: "10px", background: "none", color: "#999" }} className="btn">キャンセル</button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
